<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Show Answer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
        }
        button {
            padding: 0.75rem 1.5rem;
            margin: 0.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        #show-answer-btn {
            background: #9C27B0;
            color: white;
        }
        #show-answer-btn:hover {
            opacity: 0.9;
        }
        .answer-area {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 1rem;
            border-radius: 4px;
            border-left: 4px solid #4CAF50;
            margin-top: 1rem;
            display: none;
        }
        .answer h3 {
            margin-top: 0;
            color: #1b5e20;
        }
        .answer pre {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            border: 1px solid #ddd;
        }
        .answer code {
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Show Answer Test</h1>
    <p>Click the button below to test the Show Answer functionality:</p>
    
    <button id="show-answer-btn">Show Answer</button>
    
    <div id="answer-area" class="answer-area">
        <!-- Answer will appear here -->
    </div>

    <script>
        console.log('Test page loaded');
        
        // Mock exercise data
        const exercise = {
            id: 'test-01',
            title: 'Test Exercise',
            solution: '// This is the correct answer\nlet x = 10;\nlet y = 20;\nconsole.log(x + y);'
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showAnswer(exercise) {
            console.log('showAnswer called with exercise:', exercise.id);
            
            const answerArea = document.getElementById('answer-area');
            console.log('Answer area found:', !!answerArea);
            
            if (!answerArea) {
                console.error('Answer area not found');
                return;
            }

            // Toggle answer display
            if (answerArea.style.display === 'none' || answerArea.style.display === '') {
                console.log('Showing answer...');
                answerArea.innerHTML = `<div class="answer"><h3>✓ Correct Answer:</h3><pre><code>${escapeHtml(exercise.solution)}</code></pre></div>`;
                answerArea.style.display = 'block';
                
                // Update button text
                const showAnswerBtn = document.getElementById('show-answer-btn');
                showAnswerBtn.textContent = 'Hide Answer';
                console.log('Answer displayed');
            } else {
                console.log('Hiding answer...');
                answerArea.style.display = 'none';
                document.getElementById('show-answer-btn').textContent = 'Show Answer';
                console.log('Answer hidden');
            }
        }

        // Setup button click
        const btn = document.getElementById('show-answer-btn');
        console.log('Button found:', !!btn);
        
        if (btn) {
            btn.addEventListener('click', () => {
                console.log('Button clicked!');
                showAnswer(exercise);
            });
            console.log('Click listener attached');
        } else {
            console.error('Button not found!');
        }
    </script>
</body>
</html>
