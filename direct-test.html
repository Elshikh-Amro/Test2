<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; background: #9C27B0; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .answer-area { background: #e8f5e8; padding: 15px; border-radius: 4px; border-left: 4px solid #4CAF50; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <h1>Direct Show Answer Test</h1>
    <p>This tests the showAnswer function directly without any complex initialization.</p>

    <button id="show-answer-btn">Show Answer</button>

    <div id="answer-area" class="answer-area">
        <!-- Answer will appear here -->
    </div>

    <script>
        // Define the functions directly
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showAnswer(exercise) {
            console.log('showAnswer called for exercise:', exercise.id);

            const answerArea = document.getElementById('answer-area');

            if (!answerArea) {
                console.error('Answer area not found');
                alert('Answer area not found!');
                return;
            }

            // Toggle answer display
            if (answerArea.style.display === 'none' || answerArea.style.display === '') {
                console.log('Showing answer...');
                answerArea.innerHTML = `<div class="answer"><h3>✓ Correct Answer:</h3><pre><code>${escapeHtml(exercise.solution)}</code></pre></div>`;
                answerArea.style.display = 'block';

                // Update button text
                const showAnswerBtn = document.getElementById('show-answer-btn');
                showAnswerBtn.textContent = 'Hide Answer';
                console.log('Answer displayed');
            } else {
                console.log('Hiding answer...');
                answerArea.style.display = 'none';
                document.getElementById('show-answer-btn').textContent = 'Show Answer';
                console.log('Answer hidden');
            }
        }

        // Mock exercise data
        const exercise = {
            id: 'direct-test',
            title: 'Direct Test Exercise',
            solution: '// This is the direct test solution\nlet x = 42;\nconsole.log("Answer:", x);'
        };

        // Setup button click
        const btn = document.getElementById('show-answer-btn');
        console.log('Button found:', !!btn);

        if (btn) {
            btn.addEventListener('click', () => {
                console.log('Button clicked!');
                showAnswer(exercise);
            });
            console.log('Click listener attached');
        } else {
            console.error('Button not found!');
            alert('Button not found!');
        }

        // Test that everything is loaded
        console.log('Page loaded successfully');
        console.log('Exercise data:', exercise);
    </script>
</body>
</html>
