<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Exercise Loading</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #e8f5e8; color: #2e7d32; border: 1px solid #4CAF50; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #F44336; }
        button { padding: 10px 20px; margin: 10px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test Exercise Loading</h1>
    <div id="results"></div>

    <button onclick="testExerciseLoading()">Test Exercise Loading</button>
    <button onclick="testShowAnswer()">Test Show Answer</button>

    <script src="site/js/exercises.js"></script>
    <script src="site/js/utils.js"></script>
    <script src="site/js/validation.js"></script>
    <script>
        function addResult(message, success = true) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'test-result ' + (success ? 'success' : 'error');
            div.textContent = message;
            results.appendChild(div);
        }

        function testExerciseLoading() {
            try {
                console.log('Testing exercise loading...');

                // Mock window.location for testing
                window.location = { pathname: '/exercises/exercise-01.html' };

                const exercises = getExercises();
                addResult(`Found ${exercises.length} exercises`);

                const exercise = exercises[0];
                addResult(`First exercise: ${exercise.title} (ID: ${exercise.id})`);
                addResult(`Has solution: ${!!exercise.solution}`, !!exercise.solution);

                // Test getExerciseIdFromPath
                const pathId = getExerciseIdFromPath();
                addResult(`Path ID extraction: ${pathId}`);

                // Test getExerciseById
                const foundExercise = getExerciseById('01');
                addResult(`Exercise lookup by ID: ${!!foundExercise}`, !!foundExercise);

            } catch (error) {
                addResult(`Error: ${error.message}`, false);
                console.error(error);
            }
        }

        function testShowAnswer() {
            try {
                console.log('Testing show answer...');

                // Create mock elements
                const answerArea = document.createElement('div');
                answerArea.id = 'answer-area';
                answerArea.style.display = 'none';
                document.body.appendChild(answerArea);

                const button = document.createElement('button');
                button.id = 'show-answer-btn';
                button.textContent = 'Show Answer';
                document.body.appendChild(button);

                // Mock exercise
                const exercise = {
                    id: '01',
                    title: 'Test Exercise',
                    solution: '// Test solution\nlet x = 5;'
                };

                // Test showAnswer function
                showAnswer(exercise);
                addResult('Show answer function called successfully');

                // Check if answer area is visible
                const isVisible = answerArea.style.display === 'block';
                addResult(`Answer area visible: ${isVisible}`, isVisible);

                // Check button text
                const buttonText = button.textContent;
                addResult(`Button text: ${buttonText}`);

            } catch (error) {
                addResult(`Error: ${error.message}`, false);
                console.error(error);
            }
        }
    </script>
</body>
</html>
